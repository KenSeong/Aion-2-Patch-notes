name: check-aion-updates
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python aion_bot.py
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DISCORD_WEBHOOK2: ${{ secrets.DISCORD_WEBHOOK2 }}
          DISCORD_WEBHOOK3: ${{ secrets.DISCORD_WEBHOOK3 }}
      - name: Save seen posts
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add seen.json
          git diff --cached --quiet || (git commit -m "update seen posts" && git push)
